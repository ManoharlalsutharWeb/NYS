<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GURUJI — Minute Explorer</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<script>
  (async () => { try { const r = await fetch("/api/session"); if (!r.ok) location.href = "/login.html"; const d = await r.json(); if (!d.ok) location.href = "/login.html"; } catch { location.href = "/login.html"; } })();
</script>

<header class="topbar">
  <strong>🔮 GURUJI — Minute Explorer</strong>
  <nav class="topbar-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="ephemeris-status.html">Ephemeris Status</a>
    <a href="minute-explorer.html" class="active">Minute Explorer</a>
    <a href="varga-matrix.html">Varga Matrix</a>
    <a href="validation.html">Validation</a>
    <button id="logoutBtn" class="secondary" style="margin:0">Logout</button>
  </nav>
</header>

<main class="container">
  <div class="card">
    <h1>Minute Explorer</h1>
    <p class="muted" style="margin-bottom:14px">Calculate any single minute — New York timezone, Lahiri ayanamsa.</p>
    <div class="two">
      <div>
        <label>Date <input type="date" id="date" value="2026-09-11"></label>
        <label>Time (New York) <input type="time" id="time" value="09:30:00" step="1"></label>
      </div>
      <div>
        <label>Latitude <input id="lat" type="number" step="0.000001" value="40.7128"></label>
        <label>Longitude <input id="lon" type="number" step="0.000001" value="-74.0060"></label>
      </div>
    </div>
    <div id="vargaGrid" class="varga-grid" style="margin-top:14px"></div>
    <div class="row" style="margin-top:16px">
      <button id="calcBtn">CALCULATE</button>
    </div>
    <div id="statusBar" class="status-bar" style="margin-top:12px">Ready.</div>
  </div>

  <div class="card">
    <h2>Planet Positions</h2>
    <div id="planetTable"><p class="muted">No calculation yet.</p></div>
  </div>

  <div class="card">
    <h2>Full Record (JSON)</h2>
    <pre id="result" class="result-pane">No calculation yet.</pre>
  </div>
</main>

<script type="module">
  import { initEngine, calculate } from "./js/engine.js";
  import { VARGAS, RASHIS, nakshatra, rashiName } from "./js/vedic-rules.js";

  const $ = id => document.getElementById(id);
  const grid = $("vargaGrid");
  for (const v of VARGAS) {
    const label = document.createElement("label");
    label.className = "varga-check";
    label.innerHTML = `<input type="checkbox" value="${v}" ${v === 1 || v === 9 ? "checked" : ""}> D${v}`;
    grid.appendChild(label);
  }

  $("logoutBtn").onclick = async () => { await fetch("/api/logout", { method: "POST" }); location.href = "/login.html"; };

  $("calcBtn").onclick = async () => {
    $("statusBar").textContent = "Calculating…";
    $("planetTable").innerHTML = "";
    try {
      await initEngine();
      const selected = [...grid.querySelectorAll("input:checked")].map(x => Number(x.value));
      const r = await calculate({
        date: $("date").value, time: $("time").value,
        lat: $("lat").value, lon: $("lon").value,
        enabledVargas: selected,
      });
      $("result").textContent = JSON.stringify(r, null, 2);
      $("statusBar").textContent = `✅ Done — UTC: ${r.utc_time} · JD: ${r.julian_day?.toFixed(5)}`;

      // Planet table
      const planets = ["sun","moon","mars","mercury","jupiter","venus","saturn","rahu","ketu"];
      let html = `<table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="border-bottom:1px solid #30363d">
          <th style="text-align:left;padding:6px">Planet</th>
          <th style="text-align:right;padding:6px">Longitude</th>
          <th style="text-align:left;padding:6px">Rashi</th>
          <th style="text-align:right;padding:6px">Deg in Sign</th>
          <th style="text-align:center;padding:6px">R</th>
        </tr></thead><tbody>`;
      for (const p of planets) {
        const lon = r[`${p}_longitude`];
        if (lon == null) continue;
        const sign = RASHIS[Math.floor(((lon % 360) + 360) % 360 / 30)];
        const deg  = (((lon % 360) + 360) % 360) % 30;
        const ret  = r[`${p}_retrograde`] ? "R" : "";
        html += `<tr style="border-bottom:1px solid #21262d">
          <td style="padding:6px;font-weight:600;text-transform:capitalize">${p}</td>
          <td style="padding:6px;text-align:right;font-family:monospace">${lon.toFixed(4)}°</td>
          <td style="padding:6px">${sign}</td>
          <td style="padding:6px;text-align:right;font-family:monospace">${deg.toFixed(4)}°</td>
          <td style="padding:6px;text-align:center;color:#f85149">${ret}</td>
        </tr>`;
      }
      // Ascendant
      if (r.ascendant_longitude != null) {
        const sign = RASHIS[Math.floor(((r.ascendant_longitude % 360) + 360) % 360 / 30)];
        const deg  = (((r.ascendant_longitude % 360) + 360) % 360) % 30;
        html += `<tr style="border-top:2px solid #30363d">
          <td style="padding:6px;font-weight:700">Ascendant</td>
          <td style="padding:6px;text-align:right;font-family:monospace">${r.ascendant_longitude.toFixed(4)}°</td>
          <td style="padding:6px">${sign}</td>
          <td style="padding:6px;text-align:right;font-family:monospace">${deg.toFixed(4)}°</td>
          <td></td>
        </tr>`;
      }
      // Moon nakshatra
      if (r.moon_nakshatra) {
        html += `<tr><td colspan="5" style="padding:8px;color:#8b949e;font-size:12px">
          Moon Nakshatra: <strong style="color:#e6edf3">${r.moon_nakshatra}</strong> Pada ${r.moon_pada} · ${r.moon_rashi}
        </td></tr>`;
      }
      html += "</tbody></table>";
      $("planetTable").innerHTML = html;
    } catch (e) {
      $("statusBar").textContent = "❌ ERROR: " + e.message;
      $("result").textContent = JSON.stringify({ error: e.message }, null, 2);
    }
  };
</script>
</body>
</html>
